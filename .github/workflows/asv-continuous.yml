# Compare the latest Stingray release with main on the same runner.
# Both commits run back to back on one machine, so runner-to-runner noise
# cancels out; the report is uploaded as an artifact. No history is published.
name: Benchmark main vs latest release

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      base:
        description: "Baseline Stingray ref (default: latest release tag)"
        required: false
        default: ""

jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NUMBA_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: asv
          create-args: python=3.12 asv pytest
          init-shell: bash

      - name: Driver tests
        run: python -m pytest

      - name: Pick baseline
        run: |
          base="${{ inputs.base }}"
          if [ -z "$base" ]; then
            base=$(git ls-remote --tags --refs https://github.com/StingraySoftware/stingray.git \
                   | awk -F/ '{print $3}' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "Baseline: $base"

      - name: asv continuous
        run: |
          export CONDA_EXE="$PWD/tools/conda-shim"
          asv machine --yes --machine gh-actions
          env_name=$(python -c "import run_history; print(run_history.environment_names()['3.12'])")
          set -o pipefail
          asv continuous "$BASE" main -E "$env_name" --factor 1.2 --show-stderr \
              --machine gh-actions 2>&1 | tee asv-continuous.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asv-continuous-report
          path: asv-continuous.txt
